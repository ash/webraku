# The Webraku demos at web.raku.online — generated by `rakupp demo/run.raku nginx web.raku.online`
# from demo/demos.txt. Each demo takes its own mount off the path, so the path
# is passed on as it is.
server {
    listen 80;
    listen [::]:80;
    server_name web.raku.online;

    client_max_body_size 1m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/javascript application/javascript application/json text/css image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The client's own address, replacing any list it sent: the pixel board
    # limits how fast each address may paint by the first entry.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /sudoku  { return 301 /sudoku/; }
    location /sudoku/   { proxy_pass http://127.0.0.1:8801; }

    location = /unicode { return 301 /unicode/; }
    location /unicode/  { proxy_pass http://127.0.0.1:8802; }

    location = /pixels  { return 301 /pixels/; }
    location /pixels/   { proxy_pass http://127.0.0.1:8803; }

    location = /wavelet { return 301 /wavelet/; }
    location /wavelet/  { proxy_pass http://127.0.0.1:8804; }

    location = /sieve   { return 301 /sieve/; }
    location /sieve/    { proxy_pass http://127.0.0.1:8805; }

    location = /counter { return 301 /counter/; }
    location /counter/  { proxy_pass http://127.0.0.1:8806; }

    location /          { proxy_pass http://127.0.0.1:8800; }
}
